name: Publish npm package

on:
  push:
    tags:
      - 'npm-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish fairygui-mcp-headless
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Headless
        uses: actions/checkout@v6
        with:
          path: FairyGUI-MCP-Headless

      - name: Checkout OpenFairyGUI
        uses: actions/checkout@v6
        with:
          repository: magicskysword/OpenFairyGUI
          ref: 'v0.2.1'
          path: OpenFairyGUI

      - name: Checkout FairyGUI-dom
        uses: actions/checkout@v6
        with:
          repository: magicskysword/FairyGUI-dom
          ref: 'v1.1.1'
          path: FairyGUI-dom

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify release tag
        shell: bash
        run: |
          package_version=$(node -p "require('./FairyGUI-MCP-Headless/package.json').version")
          expected_tag="npm-v${package_version}"
          retry_suffix="${GITHUB_REF_NAME#"$expected_tag"}"

          if [[
            "$GITHUB_REF_NAME" != "$expected_tag"
            && ! "$retry_suffix" =~ ^-run\.[1-9][0-9]*$
          ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} must equal ${expected_tag} or ${expected_tag}-run.N"
            exit 1
          fi

      - name: Verify source dependency versions
        shell: bash
        run: |
          verify_dependency() {
            local dependency_name="$1"
            local source_manifest="$2"
            local dependency_range
            local expected_version
            local source_version

            dependency_range=$(node -p "require('./FairyGUI-MCP-Headless/package.json').dependencies['${dependency_name}']")
            expected_version="${dependency_range#^}"
            expected_version="${expected_version#~}"
            source_version=$(node -p "require('./${source_manifest}').version")

            if [[ "$source_version" != "$expected_version" ]]; then
              echo "::error::${dependency_name} expects ${expected_version}, but ${source_manifest} provides ${source_version}"
              exit 1
            fi
          }

          verify_dependency \
            "@magicskysword/openfairygui-core" \
            "OpenFairyGUI/packages/core/package.json"
          verify_dependency \
            "@magicskysword/openfairygui-functions" \
            "OpenFairyGUI/packages/functions/package.json"
          verify_dependency \
            "@magicskysword/fairygui-dom" \
            "FairyGUI-dom/package.json"

      - name: Build OpenFairyGUI packages
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          pnpm --dir OpenFairyGUI install --frozen-lockfile
          pnpm --dir OpenFairyGUI --filter @magicskysword/openfairygui-core build
          pnpm --dir OpenFairyGUI --filter @magicskysword/openfairygui-functions build

      - name: Build FairyGUI-dom
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          pnpm --dir FairyGUI-dom install --frozen-lockfile
          pnpm --dir FairyGUI-dom build

      - name: Install Headless dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: pnpm --dir FairyGUI-MCP-Headless install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir FairyGUI-MCP-Headless exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm --dir FairyGUI-MCP-Headless typecheck

      - name: Run implemented tests
        run: pnpm --dir FairyGUI-MCP-Headless test:implemented

      - name: Build package
        run: pnpm --dir FairyGUI-MCP-Headless build

      - name: Publish package
        working-directory: FairyGUI-MCP-Headless
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          tarball_url="https://registry.npmjs.org/@magicskysword/fairygui-mcp-headless/-/fairygui-mcp-headless-${package_version}.tgz"

          if curl --fail --silent --show-error --head "$tarball_url" >/dev/null; then
            echo "@magicskysword/fairygui-mcp-headless@${package_version} is already published"
          else
            npm publish . --access public
          fi
